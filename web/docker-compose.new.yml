# ==================== RAG Engine 服务编排 ====================
# 使用: docker compose up -d --build
# LLM 密钥通过宿主机环境变量或同目录 .env 注入（见 .env.example）
services:
  rag-engine:
    build: .
    container_name: rag-engine
    ports:
      - "8000:8000"
    environment:
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-}
      RAG_LLM_EMBEDDING_MODEL: ${RAG_LLM_EMBEDDING_MODEL:-}
      RAG_RETRIEVAL__RETRIEVER: ${RAG_RETRIEVAL__RETRIEVER:-hybrid}
      RAG_INGESTION__CHUNKER: ${RAG_INGESTION__CHUNKER:-fixed}
      RAG_ADMIN_API_KEY: ${RAG_ADMIN_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: rag-demo
    ports:
      - "7860:7860"
    environment:
      RAG_API_BASE_URL: http://rag-engine:8000
      RAG_API_KEY: rag_e76f4da0b1dc45f69d8ef4cb13f55b55
    depends_on:
      rag-engine:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  ui:
    image: nginx:alpine
    container_name: rag-ui
    ports:
      - "8080:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rag-engine
    restart: unless-stopped
